global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: fullstack-learning-api
    metrics_path: /api/metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:3000
