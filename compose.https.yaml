services:
  api:
    environment:
      MINIO_PUBLIC_URL: ${HTTPS_PUBLIC_ORIGIN:-https://localhost:8443}
      MINIO_PUBLIC_PATH_PREFIX: /storage

  web:
    ports:
      - "${WEB_HTTPS_HOST_PORT:-8443}:443"
    volumes:
      - ./.certs/dev.crt:/etc/nginx/tls/dev.crt:ro
      - ./.certs/dev.key:/etc/nginx/tls/dev.key:ro
      - ./apps/web/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
