name: fullstack-learning-lab-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fullstack_lab_test
      POSTGRES_USER: fullstack_test
      POSTGRES_PASSWORD: fullstack_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullstack_test -d fullstack_lab_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_password
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
